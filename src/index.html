<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battleship</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="battleship">
        <header class="masthead">
            <h1>Battleship</h1>
            <p class="status-readout" id="turnDisplay">Setting up…</p>
        </header>

        <div class="controls">
            <span class="control-label">Manual ship placement</span>
            <label class="switch">
                <input type="checkbox" class="toggle-mode" />
                <span class="slider round"></span>
            </label>
            <button class="pvp" type="button">Enable PvP</button>
            <button id="rotateShip" type="button" class="hidden">Rotate ship</button>
            <button class="restart" type="button">Restart</button>
        </div>

        <div class="game">
            <div class="board-panel">
                <p class="board-label" id="gridContainerLabel">Your Fleet</p>
                <div id="gridContainer" class="board-frame"></div>
            </div>
            <div class="board-panel">
                <p class="board-label" id="gridContainerOpponentLabel">Enemy Waters</p>
                <div id="gridContainerOpponent" class="board-frame"></div>
            </div>
        </div>

        <div class="ships-container hidden">
            <p class="yard-instructions">
                Drag a ship onto your board, or tap a ship then tap a cell to place it.
                Use "Rotate ship" to change orientation.
            </p>
            <div id="shipYard"></div>
        </div>

        <div class="legend">
            <div class="legend-item"><span class="legend-swatch"
                    style="background:var(--fleet);border-color:var(--fleet-border)"></span>Ship</div>
            <div class="legend-item"><span class="legend-swatch" style="background:var(--miss)"></span>Miss</div>
            <div class="legend-item"><span class="legend-swatch"
                    style="background:var(--hit);border-color:var(--hit-border)"></span>Hit</div>
            <div class="legend-item"><span class="legend-swatch"
                    style="background:var(--sunk);border-color:var(--sunk-border)"></span>Sunk</div>
        </div>
    </div>

    <div id="popupOverlay" class="overlay"></div>

    <script type="module" src="./index.js"></script>
</body>

</html>
